<html lang="ja">

  <title>アイドル 雑誌・写真集・CD/Blu-ray カタログ｜乃木坂46・櫻坂46・日向坂46・AKB48</title>
  <meta name="description" content="乃木坂46・櫻坂46・日向坂46・AKB48・チーム8（OG）の最新雑誌・写真集・CD/Blu-rayリリース一覧をグループ・カテゴリ別に比較・検索できるカタログサイトです。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍀</text></svg>">
  <style>
    :root {
      --bg: #f0fdf4;
      --header-bg: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
      --card: #ffffff;
      --text: #1f2937;
      --muted: #4b5563;
      --border: #bbf7d0;
      --primary: #16a34a;
      --primary-dark: #15803d;
      --rakuten: #bf0000;
      --reserve: #d97706;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--header-bg);
      border-bottom: 2px solid #86efac;

      box-shadow: 0 2px 8px rgba(22, 163, 74, 0.12);
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    h1 { margin: 0; font-size: 1.3rem; color: #14532d; }
    .sister-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #fff7ed;
      color: #c2410c;
      border: 1px solid #fdba74;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s;
    }
    .sister-link:hover {
      background: #ffedd5;
      transform: translateY(-1px);

    .pr-note { font-size: 0.75rem; color: #166534; margin: 0 0 12px; }

    .filter-btn {

      color: #166534;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;

      font-weight: 700;
      transition: all 0.15s;
    }
    .filter-btn:hover { background: #ffffff; }
    .filter-btn.active {
      background: var(--primary-dark);
      color: #fff;
      border-color: var(--primary-dark);
      box-shadow: 0 2px 6px rgba(21, 128, 61, 0.3);
    }
    .container { max-width: 1100px; margin: 22px auto; padding: 0 16px 60px; }
    .auth-box {
      display: none;
      max-width: 420px;
      margin: 0 auto 24px;
      background: #ffffff;
      border: 2px solid var(--primary);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.12);
    }
    .auth-box.visible { display: block; }
    .auth-box h2 { margin: 0 0 8px; font-size: 1.05rem; color: #166534; }
    .auth-row { display: flex; gap: 8px; margin-top: 12px; }
    .auth-row input { flex: 1; }
    .admin-panel {
      display: none;
      background: #ffffff;
      border: 2px solid var(--primary);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.12);
    }
    .admin-panel.visible { display: block; }
    .admin-panel h2 { margin: 0 0 12px; font-size: 1.1rem; color: #166534; }
    .edit-banner {
      display: none;
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;

      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 700;
      margin-bottom: 12px;

      align-items: center;
      gap: 10px;
    }
    .edit-banner.visible { display: flex; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

      margin-bottom: 12px;
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 0.8rem; font-weight: 700; color: #166534; }
    input, select, textarea {
      padding: 9px 10px;
      border: 1px solid #86efac;
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      background: #f7fee7;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #ffffff;
    }
    textarea { min-height: 80px; resize: vertical; }
    .admin-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .btn {
      padding: 10px 16px;

    }
    .btn-save { background: var(--primary-dark); color: #fff; }
    .btn-save.editing { background: #d97706; }
    .btn-cancel { background: #e5e7eb; color: #374151; padding: 6px 12px; font-size: 0.8rem; }
    .btn-export { background: #2563eb; color: #fff; }
    .btn-reset { background: #ef4444; color: #fff; }
    .json-output-area { margin-top: 14px; display: none; }
    .json-output-area textarea {
      width: 100%;
      height: 180px;
      font-family: monospace;
      font-size: 0.8rem;
      background: #f0fdf4;
    }
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.08);
      transition: transform 0.15s;
    }
    .card:hover { transform: translateY(-2px); }
    .card-img-wrap {
      background: #f7fee7;

      display: flex;

      align-items: center;

    .card-img-wrap img { max-width: 100%; max-height: 250px; object-fit: contain; border-radius: 6px; }
    .card-body { padding: 16px; display: flex; flex-direction: column; flex: 1; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .badge { font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
    .badge-group { background: #dcfce7; color: #15803d; }
    .badge-cat { background: #fef3c7; color: #92400e; }
    .card-title { font-size: 0.96rem; font-weight: 700; margin: 0 0 10px; line-height: 1.45; }
    .memo-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.8rem;
      color: #14532d;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      margin-top: auto;
    }
    .price { font-size: 1.18rem; font-weight: 800; color: var(--primary-dark); }
    .price small { font-size: 0.75rem; font-weight: 400; color: var(--muted); }
    .release-date { font-size: 0.8rem; color: var(--muted); }
    .card-actions { display: flex; flex-direction: column; gap: 8px; }
    .action-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }
    .btn-rakuten { background: var(--rakuten); color: #fff; }
    .btn-reserve { background: var(--reserve); color: #fff; }
    .admin-card-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .btn-edit { background: #fef3c7; color: #92400e; font-size: 0.78rem; padding: 6px; }
    .btn-del { background: #fee2e2; color: #b91c1c; font-size: 0.78rem; padding: 6px; }
    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #166534;
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 14px;
    }
    .scroll-top-btn {
      position: fixed;
      right: 16px;
      bottom: 18px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary-dark);
      color: #ffffff;
      border: 2px solid #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(21, 128, 61, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.15s;
      z-index: 90;
    }
    .scroll-top-btn.visible { opacity: 0.92; pointer-events: auto; }
    .scroll-top-btn:hover { opacity: 1; transform: translateY(-2px); }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-top">
      <h1>アイドル 雑誌・写真集・CD/Blu-ray カタログ</h1>
      <a class="sister-link" href="https://marron-stage.github.io/digital-photobook/">📱 デジタル写真集 カタログ（楽天Kobo）はこちら →</a>
    </div>
    <p class="pr-note">※当サイトはアフィリエイト広告（楽天アフィリエイト等）を利用しています。</p>

    <div class="filters" id="groupFilters">
      <button class="filter-btn active" data-group="すべて">すべて</button>
      <button class="filter-btn" data-group="乃木坂46">乃木坂46</button>
      <button class="filter-btn" data-group="櫻坂46">櫻坂46</button>
      <button class="filter-btn" data-group="日向坂46">日向坂46</button>
      <button class="filter-btn" data-group="AKB48">AKB48</button>
      <button class="filter-btn" data-group="チーム8（OG）">チーム8（OG）</button>
    </div>

    <div class="filters" id="catFilters">
      <button class="filter-btn active" data-cat="すべて">すべて</button>
      <button class="filter-btn" data-cat="雑誌">雑誌</button>
      <button class="filter-btn" data-cat="写真集">写真集</button>
      <button class="filter-btn" data-cat="デジタル写真集">デジタル写真集</button>
      <button class="filter-btn" data-cat="CD・Blu-ray">CD・Blu-ray</button>
    </div>
  </div>
</header>

<div class="container">
  <section class="auth-box" id="authBox">
    <h2>🔒 管理パネル ロック解除</h2>
    <p style="font-size:0.82rem; color:#4b5563; margin:0;">管理者パスワードを入力してください</p>
    <div class="auth-row">
      <input type="password" id="adminPassInput" placeholder="パスワード" onkeydown="if(event.key==='Enter') unlockAdmin()" />
      <button class="btn btn-save" onclick="unlockAdmin()">解除</button>
    </div>
  </section>

  <section class="admin-panel" id="adminPanel">
    <h2>🛠️ カタログ登録・編集・JSON管理パネル</h2>

    <div class="edit-banner" id="editBanner">
      <span id="editBannerText">✏️ 既存アイテムを編集中です</span>
      <button type="button" class="btn btn-cancel" onclick="cancelEdit()">編集をキャンセル</button>
    </div>

    <details id="manualFormDetails" open style="margin-bottom: 18px;">
      <summary style="cursor:pointer; font-weight:700; color:#166534; margin-bottom:12px;">✍️ 手動で1件ずつ入力・編集する</summary>
      <div class="form-grid">
        <div class="form-group">
          <label>グループ名</label>
          <select id="inGroup">
            <option value="乃木坂46">乃木坂46</option>
            <option value="櫻坂46">櫻坂46</option>
            <option value="日向坂46">日向坂46</option>
            <option value="AKB48">AKB48</option>
            <option value="チーム8（OG）">チーム8（OG）</option>
          </select>
        </div>
        <div class="form-group">
          <label>カテゴリ</label>
          <select id="inCat">
            <option value="雑誌">雑誌</option>
            <option value="写真集">写真集</option>
            <option value="デジタル写真集">デジタル写真集</option>
            <option value="CD・Blu-ray">CD・Blu-ray</option>
          </select>
        </div>
        <div class="form-group">
          <label>発売日（例: 2026-11-16）</label>
          <input type="date" id="inDate" />
        </div>
        <div class="form-group">
          <label>価格（税込・数字のみ 例: 1650）</label>
          <input type="number" id="inPrice" placeholder="1650" />
        </div>
        <div class="form-group full">
          <label>商品名</label>
          <input type="text" id="inTitle" placeholder="〇〇 1st写真集..." />
        </div>
        <div class="form-group full">
          <label>商品画像URL</label>
          <input type="text" id="inImage" placeholder="https://..." />
        </div>
        <div class="form-group full">
          <label>楽天アフィリエイトURL</label>
          <input type="text" id="inUrl" placeholder="https://hb.afl.rakuten.co.jp/..." />
        </div>
        <div class="form-group full">
          <label>ひとことメモ（特典・仕様など）</label>
          <textarea id="inMemo" placeholder="・先着特典あり"></textarea>
        </div>
      </div>
      <button class="btn btn-save" id="saveBtn" onclick="saveItem()">＋ 手動入力データをカタログに追加する</button>
    </details>

    <div class="admin-actions">
      <button class="btn btn-export" onclick="exportJson()">📋 リストを更新する（JSON書き出し）</button>
      <button class="btn btn-reset" onclick="resetStorage()">⚠️ ブラウザ一時データをリセット</button>
    </div>

    <div class="json-output-area" id="jsonOutputArea">
      <p style="font-size:0.82rem; font-weight:700; margin:10px 0 4px;">
        ▼ 以下のJSONを全選択コピーして、GitHubの <code>items.json</code> に上書きしてください：
      </p>
      <textarea id="jsonText" readonly onclick="this.select()"></textarea>
    </div>
  </section>

  <main class="catalog-grid" id="catalogGrid"></main>
</div>

<button type="button" class="scroll-top-btn" id="scrollTopBtn" aria-label="一番上へ戻る" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">▲</button>

<script>
  const ADMIN_PASS = "kuroshiba99";
  const AUTH_SESSION_KEY = "idol_catalog_admin_authed";
  const STORAGE_KEY = "idol_catalog_items_v1";

  let catalogItems = [];
  let currentGroup = "すべて";
  let currentCat = "すべて";
  let editingIndex = null;
  let isAdminUnlocked = false;

  const isAdminParam = new URLSearchParams(window.location.search).get("admin") === "1";

  function checkAdminAccess() {
    if (!isAdminParam) return;
    if (sessionStorage.getItem(AUTH_SESSION_KEY) === "true") {
      activateAdminMode();
    } else {
      document.getElementById("authBox").classList.add("visible");
    }
  }

  function unlockAdmin() {
    const val = document.getElementById("adminPassInput").value;
    if (val === ADMIN_PASS) {
      sessionStorage.setItem(AUTH_SESSION_KEY, "true");
      document.getElementById("authBox").classList.remove("visible");
      activateAdminMode();
      renderCatalog();
    } else {
      alert("パスワードが違います。");
    }
  }

  function activateAdminMode() {
    isAdminUnlocked = true;
    document.getElementById("adminPanel").classList.add("visible");
  }

  checkAdminAccess();

  async function initCatalog() {
    let fileItems = [];
    try {
      const res = await fetch("./items.json?t=" + Date.now());
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data)) fileItems = data;
      }
    } catch (e) {
      console.warn("items.json読み込みスキップ:", e);
    }

    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        catalogItems = Array.isArray(parsed) ? parsed : fileItems;
      } catch {
        catalogItems = fileItems;
      }
    } else {
      catalogItems = fileItems;
    }

    renderCatalog();
  }

  function formatPrice(rawPrice) {
    const num = Number(String(rawPrice).replace(/[^0-9]/g, ""));
    return isNaN(num) || num === 0 ? "価格未定" : "¥" + num.toLocaleString("ja-JP");
  }

  function getTodayString() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function renderCatalog() {
    const grid = document.getElementById("catalogGrid");
    if (!Array.isArray(catalogItems)) catalogItems = [];

    const todayStr = getTodayString();

    const filtered = catalogItems.filter(item => {
      const matchGroup = currentGroup === "すべて" || item.group === currentGroup;
      const matchCat = currentCat === "すべて" || item.category === currentCat;
      return matchGroup && matchCat;
    });

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-msg">該当するアイテムがありません。</div>`;
      return;
    }

    grid.innerHTML = filtered.map((item) => {
      const realIndex = catalogItems.indexOf(item);
      const dateLabel = item.date ? item.date.replace(/-/g, "/") : "未定";
      const isFuture = item.date && item.date > todayStr;
      const btnClass = isFuture ? "btn-reserve" : "btn-rakuten";
      const btnLabel = isFuture ? "🛒 楽天市場で予約する" : "🛒 楽天市場で購入・詳細";

      return `
        <article class="card">
          <div class="card-img-wrap">
            ${item.image ? `<img src="${item.image}" alt="${escapeHtml(item.title || '')}" loading="lazy" />` : `<span style="color:#86efac;font-size:0.85rem;font-weight:700;">NO IMAGE</span>`}
          </div>
          <div class="card-body">
            <div class="badges">
              <span class="badge badge-group">${escapeHtml(item.group || 'その他')}</span>
              <span class="badge badge-cat">${escapeHtml(item.category || '雑誌')}</span>
            </div>
            <h2 class="card-title">${escapeHtml(item.title || '')}</h2>
            ${item.memo ? `<div class="memo-box">${escapeHtml(item.memo)}</div>` : ""}
            <div class="card-meta">
              <div class="price">${formatPrice(item.price)} <small>(税込)</small></div>
              <div class="release-date">発売日：${dateLabel}</div>
            </div>
            <div class="card-actions">
              <a class="action-btn ${btnClass}" href="${item.url || '#'}" target="_blank" rel="nofollow sponsored noopener">${btnLabel}</a>
              ${isAdminUnlocked ? `
                <div class="admin-card-btns">
                  <button class="action-btn btn-edit" onclick="editItem(${realIndex})">✏️ 編集する</button>
                  <button class="action-btn btn-del" onclick="deleteItem(${realIndex})">🗑️ 削除</button>
                </div>
              ` : ""}
            </div>
          </div>
        </article>
      `;
    }).join("");
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function editItem(index) {
    const item = catalogItems[index];
    if (!item) return;

    editingIndex = index;
    document.getElementById("manualFormDetails").open = true;
    document.getElementById("inGroup").value = item.group || "乃木坂46";
    document.getElementById("inCat").value = item.category || "雑誌";
    document.getElementById("inDate").value = item.date || "";
    document.getElementById("inPrice").value = item.price || "";
    document.getElementById("inTitle").value = item.title || "";
    document.getElementById("inImage").value = item.image || "";
    document.getElementById("inUrl").value = item.url || "";
    document.getElementById("inMemo").value = item.memo || "";

    const banner = document.getElementById("editBanner");
    document.getElementById("editBannerText").textContent = `✏️ 編集中：${item.title.slice(0, 28)}...`;
    banner.classList.add("visible");

    const saveBtn = document.getElementById("saveBtn");
    saveBtn.textContent = "💾 変更を上書き保存する";
    saveBtn.classList.add("editing");

    document.getElementById("adminPanel").scrollIntoView({ behavior: "smooth" });
  }

  function cancelEdit() {
    editingIndex = null;
    document.getElementById("editBanner").classList.remove("visible");

    const saveBtn = document.getElementById("saveBtn");
    saveBtn.textContent = "＋ 手動入力データをカタログに追加する";
    saveBtn.classList.remove("editing");

    document.getElementById("inDate").value = "";
    document.getElementById("inTitle").value = "";
    document.getElementById("inPrice").value = "";
    document.getElementById("inImage").value = "";
    document.getElementById("inUrl").value = "";
    document.getElementById("inMemo").value = "";
  }

  function saveItem() {
    const group = document.getElementById("inGroup").value;
    const category = document.getElementById("inCat").value;
    const date = document.getElementById("inDate").value;
    const price = Number(String(document.getElementById("inPrice").value).replace(/[^0-9]/g, ""));
    const title = document.getElementById("inTitle").value.trim();
    const image = document.getElementById("inImage").value.trim();
    const url = document.getElementById("inUrl").value.trim();
    const memo = document.getElementById("inMemo").value.trim();

    if (!title || !url) {
      alert("「商品名」と「楽天アフィリエイトURL」は必須です。");
      return;
    }

    const itemData = { group, category, title, date, price, image, url, memo };

    if (editingIndex !== null && catalogItems[editingIndex]) {
      catalogItems[editingIndex] = itemData;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(catalogItems));
      cancelEdit();
      renderCatalog();
      exportJson();
      alert("変更を上書き保存しました！下のJSONをコピーして items.json に貼り付けてください。");
    } else {
      catalogItems.unshift(itemData);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(catalogItems));
      cancelEdit();
      renderCatalog();
      exportJson();
      alert("カタログに追加しました！下のJSONをコピーして items.json に貼り付けてください。");
    }
  }

  function deleteItem(index) {
    if (!confirm("このアイテムをリストから削除しますか？")) return;
    if (editingIndex === index) cancelEdit();
    catalogItems.splice(index, 1);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(catalogItems));
    renderCatalog();
    exportJson();
  }

  function exportJson() {
    const area = document.getElementById("jsonOutputArea");
    const textarea = document.getElementById("jsonText");
    area.style.display = "block";
    textarea.value = JSON.stringify(catalogItems, null, 2);
  }

  function resetStorage() {
    if (!confirm("ブラウザの一時保存データを消去し、最新の items.json を再読み込みしますか？")) return;
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }

  document.querySelectorAll("#groupFilters .filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#groupFilters .filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentGroup = btn.dataset.group;
      renderCatalog();
    });
  });

  document.querySelectorAll("#catFilters .filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#catFilters .filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCat = btn.dataset.cat;
      renderCatalog();
    });
  });

  window.addEventListener("scroll", () => {
    const btn = document.getElementById("scrollTopBtn");
    if (window.scrollY > 250) {
      btn.classList.add("visible");
    } else {
      btn.classList.remove("visible");
    }
  });

  initCatalog();
</script>
</body>
</html>
