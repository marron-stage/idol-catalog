<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="google-site-verification" content="ayQpjql4aQeIt2ZV0yeS1zrJ0WSKVUyKHHWGhvxiLUs" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>坂道・AKB48・チーム8 雑誌・写真集・CD/Blu-ray カタログ</title>
  <meta name="description" content="乃木坂46・櫻坂46・日向坂46・AKB48・チーム8（OG）の最新CD・Blu-ray予約情報や、楽天ブックス・楽天Koboのデジタル写真集を一覧で比較できるカタログサイトです。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍀</text></svg>">
  <style>
    :root {
      --bg: #eefbf3;
      --header-bg: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
      --card: #ffffff;
      --text: #1f2937;
      --muted: #4b5563;
      --border: #a7f3d0;
      --primary: #10b981;
      --primary-dark: #059669;
      --rakuten: #bf0000;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--header-bg);
      border-bottom: 2px solid #6ee7b7;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.1);
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.3rem;
      color: #064e3b;
    }
    .pr-note {
      font-size: 0.75rem;
      color: #065f46;
      margin: 0 0 12px;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .filter-btn {
      border: 1px solid #6ee7b7;
      background: rgba(255, 255, 255, 0.85);
      color: #065f46;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.15s;
    }
    .filter-btn:hover {
      background: #ffffff;
    }
    .filter-btn.active {
      background: var(--primary-dark);
      color: #fff;
      border-color: var(--primary-dark);
      box-shadow: 0 2px 6px rgba(5, 150, 105, 0.3);
    }
    .container {
      max-width: 1100px;
      margin: 22px auto;
      padding: 0 16px 60px;
    }
    /* 管理パネル */
    .admin-panel {
      display: none;
      background: #ffffff;
      border: 2px solid var(--primary);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.12);
    }
    .admin-panel.visible { display: block; }
    .admin-panel h2 {
      margin: 0 0 12px;
      font-size: 1.1rem;
      color: #065f46;
    }
    .edit-banner {
      display: none;
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 700;
      margin-bottom: 12px;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .edit-banner.visible { display: flex; }
    .api-box {
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .api-results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
      margin-top: 14px;
      max-height: 440px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .api-card {
      background: #ffffff;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.82rem;
    }
    .api-card img {
      height: 120px;
      object-fit: contain;
      margin: 0 auto;
    }
    .api-card-title {
      font-weight: 700;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-group.full {
      grid-column: 1 / -1;
    }
    label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #065f46;
    }
    input, select, textarea {
      padding: 9px 10px;
      border: 1px solid #a7f3d0;
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      background: #f9fefb;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #ffffff;
    }
    textarea {
      min-height: 80px;
      resize: vertical;
    }
    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .btn-save { background: var(--primary-dark); color: #fff; }
    .btn-save.editing { background: #d97706; }
    .btn-cancel { background: #e5e7eb; color: #374151; padding: 6px 12px; font-size: 0.8rem; }
    .btn-api { background: #0284c7; color: #fff; }
    .btn-export { background: #2563eb; color: #fff; }
    .btn-reset { background: #ef4444; color: #fff; }
    .json-output-area {
      margin-top: 14px;
      display: none;
    }
    .json-output-area textarea {
      width: 100%;
      height: 180px;
      font-family: monospace;
      font-size: 0.8rem;
      background: #f0fdf4;
    }
    /* カタロググリッド */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.08);
      transition: transform 0.15s;
    }
    .card:hover {
      transform: translateY(-2px);
    }
    .card-img-wrap {
      background: #f7fef9;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid #d1fae5;
      min-height: 160px;
    }
    .card-img-wrap img {
      max-width: 100%;
      max-height: 240px;
      object-fit: contain;
      border-radius: 6px;
    }
    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
    }
    .badge-cat { background: #fef3c7; color: #92400e; }
    .badge-cat-digital { background: #ffedd5; color: #c2410c; }
    .badge-group { background: #d1fae5; color: #065f46; }
    .badge-team8 { background: #e0f2fe; color: #0369a1; }
    .card-title {
      font-size: 0.96rem;
      font-weight: 700;
      margin: 0 0 10px;
      line-height: 1.45;
    }
    .memo-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.8rem;
      color: #166534;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      margin-top: auto;
    }
    .price {
      font-size: 1.18rem;
      font-weight: 800;
      color: #059669;
    }
    .price small {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--muted);
    }
    .release-date {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .action-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }
    .btn-rakuten {
      background: var(--rakuten);
      color: #fff;
    }
    .admin-card-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .btn-edit {
      background: #fef3c7;
      color: #92400e;
      font-size: 0.78rem;
      padding: 6px;
    }
    .btn-del {
      background: #fee2e2;
      color: #b91c1c;
      font-size: 0.78rem;
      padding: 6px;
    }
    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #065f46;
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 14px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>アイドル 雑誌・写真集・CD/Blu-ray カタログ</h1>
    <p class="pr-note">※当サイトはアフィリエイト広告（楽天アフィリエイト等）を利用しています。</p>

    <div class="filters" id="groupFilters">
      <button class="filter-btn active" data-group="すべて">すべて</button>
      <button class="filter-btn" data-group="乃木坂46">乃木坂46</button>
      <button class="filter-btn" data-group="櫻坂46">櫻坂46</button>
      <button class="filter-btn" data-group="日向坂46">日向坂46</button>
      <button class="filter-btn" data-group="AKB48">AKB48</button>
      <button class="filter-btn" data-group="チーム8（OG）">チーム8（OG）</button>
    </div>

    <div class="filters" id="categoryFilters">
      <button class="filter-btn active" data-category="すべて">すべて</button>
      <button class="filter-btn" data-category="雑誌">雑誌</button>
      <button class="filter-btn" data-category="写真集">写真集</button>
      <button class="filter-btn" data-category="デジタル写真集">デジタル写真集</button>
      <button class="filter-btn" data-category="CD・Blu-ray">CD・Blu-ray</button>
    </div>
  </div>
</header>

<div class="container">
  <!-- 管理パネル（URL末尾に ?admin=1 をつけると表示） -->
  <section class="admin-panel" id="adminPanel">
    <h2>🛠️ 商品登録・編集・JSON管理パネル</h2>

    <!-- 編集中バナー -->
    <div class="edit-banner" id="editBanner">
      <span id="editBannerText">✏️ 既存アイテムを編集中です</span>
      <button type="button" class="btn btn-cancel" onclick="cancelEdit()">編集をキャンセル</button>
    </div>

    <!-- 手動登録・編集フォーム -->
    <details id="manualFormDetails" open style="margin-bottom: 18px;">
      <summary style="cursor:pointer; font-weight:700; color:#065f46; margin-bottom:12px;">✍️ 手動で1件ずつ入力・編集する</summary>
      <div class="form-grid">
        <div class="form-group">
          <label>グループ</label>
          <select id="inGroup">
            <option value="乃木坂46">乃木坂46</option>
            <option value="櫻坂46">櫻坂46</option>
            <option value="日向坂46">日向坂46</option>
            <option value="AKB48">AKB48</option>
            <option value="チーム8（OG）">チーム8（OG）</option>
          </select>
        </div>
        <div class="form-group">
          <label>ジャンル</label>
          <select id="inCategory">
            <option value="雑誌">雑誌</option>
            <option value="写真集">写真集</option>
            <option value="デジタル写真集">デジタル写真集</option>
            <option value="CD・Blu-ray">CD・Blu-ray</option>
          </select>
        </div>
        <div class="form-group">
          <label>発売日（例: 2026-12-02）</label>
          <input type="date" id="inDate" />
        </div>
        <div class="form-group">
          <label>価格（税込・数字のみ 例: 1999）</label>
          <input type="number" id="inPrice" placeholder="1999" />
        </div>
        <div class="form-group full">
          <label>商品名</label>
          <input type="text" id="inTitle" placeholder="【デジタル限定】大西桃香写真集..." />
        </div>
        <div class="form-group full">
          <label>表紙ジャケット画像URL</label>
          <input type="text" id="inImage" placeholder="https://..." />
        </div>
        <div class="form-group full">
          <label>楽天アフィリエイトURL（楽天ブックス / 楽天Kobo）</label>
          <input type="text" id="inUrl" placeholder="https://hb.afl.rakuten.co.jp/..." />
        </div>
        <div class="form-group full">
          <label>事実メモ（特典・ポストカード・仕様など）</label>
          <textarea id="inMemo" placeholder="・特典：ポストカード付き"></textarea>
        </div>
      </div>
      <button class="btn btn-save" id="saveBtn" onclick="saveItem()">＋ 手動入力データをカタログに追加する</button>
    </details>

    <!-- 楽天ブックスAPI 自動検索パネル -->
    <details class="api-box">
      <summary style="cursor:pointer; font-weight:700; color:#065f46;">🔍 楽天ブックスAPI 自動検索（API復旧時用）</summary>
      <div class="form-grid" style="margin-top:12px;">
        <div class="form-group">
          <label>楽天アプリID（自動保存されます）</label>
          <input type="text" id="rakutenAppId" placeholder="1057491916389578..." />
        </div>
        <div class="form-group">
          <label>検索キーワード（例: 大西桃香 写真集）</label>
          <input type="text" id="apiKeyword" placeholder="大西桃香 写真集" onkeydown="if(event.key==='Enter') searchRakutenBooks()" />
        </div>
        <div class="form-group">
          <label>登録先グループ</label>
          <select id="apiGroup">
            <option value="乃木坂46">乃木坂46</option>
            <option value="櫻坂46">櫻坂46</option>
            <option value="日向坂46">日向坂46</option>
            <option value="AKB48">AKB48</option>
            <option value="チーム8（OG）">チーム8（OG）</option>
          </select>
        </div>
        <div class="form-group">
          <label>登録先ジャンル</label>
          <select id="apiCategory">
            <option value="CD・Blu-ray">CD・Blu-ray</option>
            <option value="雑誌">雑誌</option>
            <option value="写真集">写真集</option>
            <option value="デジタル写真集">デジタル写真集</option>
          </select>
        </div>
      </div>
      <button class="btn btn-api" onclick="searchRakutenBooks()">🔍 楽天ブックスで検索する</button>
      <span id="apiStatus" style="font-size:0.82rem; margin-left:10px; color:#065f46; font-weight:700;"></span>
      <div class="api-results" id="apiResults"></div>
    </details>

    <div class="admin-actions">
      <button class="btn btn-export" onclick="exportJson()">📋 リストを更新する（JSON書き出し）</button>
      <button class="btn btn-reset" onclick="resetStorage()">⚠️ ブラウザ一時データをリセット</button>
    </div>

    <div class="json-output-area" id="jsonOutputArea">
      <p style="font-size:0.82rem; font-weight:700; margin:10px 0 4px;">
        ▼ 以下のJSONを全選択コピーして、GitHubの <code>items.json</code> に上書きしてください（最初から <code>[</code> と <code>]</code> で囲まれています）：
      </p>
      <textarea id="jsonText" readonly onclick="this.select()"></textarea>
    </div>
  </section>

  <main class="catalog-grid" id="catalogGrid"></main>
</div>

<script>
  const STORAGE_KEY = "idol_catalog_items_v2";
  const APP_ID_KEY = "rakuten_app_id_saved";
  const AFFILIATE_ID = "5986eeb3.3ae4a14f.5986eeb4.1808f269";

  let catalogItems = [];
  let apiFetchedItems = [];
  let currentGroup = "すべて";
  let currentCategory = "すべて";
  let editingIndex = null;

  const isAdmin = new URLSearchParams(window.location.search).get("admin") === "1";
  if (isAdmin) {
    document.getElementById("adminPanel").classList.add("visible");
    const savedAppId = localStorage.getItem(APP_ID_KEY);
    if (savedAppId) document.getElementById("rakutenAppId").value = savedAppId;
  }

  async function initCatalog() {
    let fileItems = [];
    try {
      const res = await fetch("./items.json?t=" + Date.now());
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data)) {
          fileItems = data;
        } else if (data && typeof data === "object") {
          fileItems = [data];
        }
      }
    } catch (e) {
      console.warn("items.json読み込みスキップ:", e);
    }

    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        catalogItems = Array.isArray(parsed) ? parsed : fileItems;
      } catch {
        catalogItems = fileItems;
      }
    } else {
      catalogItems = fileItems;
    }

    renderCatalog();
  }

  // 楽天ブックスAPI検索
  async function searchRakutenBooks() {
    const appId = document.getElementById("rakutenAppId").value.trim();
    const keyword = document.getElementById("apiKeyword").value.trim();
    const statusEl = document.getElementById("apiStatus");
    const resultsEl = document.getElementById("apiResults");

    if (!appId) {
      alert("楽天アプリIDを入力してください。");
      return;
    }
    if (!keyword) {
      alert("検索キーワードを入力してください。");
      return;
    }

    localStorage.setItem(APP_ID_KEY, appId);
    statusEl.textContent = "検索中...";
    resultsEl.innerHTML = "";

    try {
      const apiUrl = `https://app.rakuten.co.jp/services/api/BooksTotal/Search/20170404?format=json&keyword=${encodeURIComponent(keyword)}&applicationId=${encodeURIComponent(appId)}&affiliateId=${encodeURIComponent(AFFILIATE_ID)}&hits=20`;
      const res = await fetch(apiUrl);
      const data = await res.json();

      if (data.error) {
        statusEl.textContent = `エラー: ${data.error_description || data.error}`;
        return;
      }

      apiFetchedItems = (data.Items || []).map(wrapper => wrapper.Item);
      statusEl.textContent = `${apiFetchedItems.length}件ヒットしました！`;

      if (apiFetchedItems.length === 0) {
        resultsEl.innerHTML = `<p style="color:#4b5563;">一致する商品が見つかりませんでした。</p>`;
        return;
      }

      resultsEl.innerHTML = apiFetchedItems.map((item, idx) => {
        const img = (item.largeImageUrl || item.mediumImageUrl || "").replace("?_ex=200x200", "?_ex=400x400");
        return `
          <div class="api-card">
            <img src="${img}" alt="" />
            <div class="api-card-title">${escapeHtml(item.title)}</div>
            <div style="color:#059669; font-weight:800;">¥${Number(item.itemPrice).toLocaleString("ja-JP")} / ${escapeHtml(item.salesDate || "")}</div>
            <button class="btn btn-save" style="padding:6px; font-size:0.8rem; margin-top:auto;" onclick="addFromApi(${idx})">＋ カタログに追加</button>
          </div>
        `;
      }).join("");
    } catch (err) {
      statusEl.textContent = "通信エラーが発生しました。時間を置いて再試行してください。";
      console.error(err);
    }
  }

  // API検索結果からワンクリック追加
  function addFromApi(idx) {
    const item = apiFetchedItems[idx];
    if (!item) return;

    const group = document.getElementById("apiGroup").value;
    const category = document.getElementById("apiCategory").value;
    const img = (item.largeImageUrl || item.mediumImageUrl || "").replace("?_ex=200x200", "?_ex=400x400");
    const affUrl = item.affiliateUrl || item.itemUrl;
    const dateFormatted = normalizeSalesDate(item.salesDate);
    const memoText = item.itemCaption ? item.itemCaption.slice(0, 180) : "";

    const newItem = {
      group,
      category,
      title: item.title,
      date: dateFormatted,
      price: Number(item.itemPrice) || 0,
      image: img,
      url: affUrl,
      memo: memoText
    };

    catalogItems.unshift(newItem);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(catalogItems));
    renderCatalog();
    exportJson();
  }

  function normalizeSalesDate(salesDate) {
    if (!salesDate) return "";
    const m = salesDate.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
    if (m) {
      return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
    }
    return salesDate;
  }

  function formatPrice(rawPrice) {
    const num = Number(String(rawPrice).replace(/[^0-9]/g, ""));
    return isNaN(num) || num === 0 ? "価格未定" : "¥" + num.toLocaleString("ja-JP");
  }

  function normalizeCategory(cat) {
    if (!cat) return "CD・Blu-ray";
    if (cat === "CD" || cat === "Blu-ray" || cat === "CD/Blu-ray") return "CD・Blu-ray";
    return cat;
  }

  function renderCatalog() {
    const grid = document.getElementById("catalogGrid");
    if (!Array.isArray(catalogItems)) catalogItems = [];

    const filtered = catalogItems.filter(item => {
      const matchGroup = currentGroup === "すべて" || item.group === currentGroup;
      const matchCat = currentCategory === "すべて" || normalizeCategory(item.category) === currentCategory;
      return matchGroup && matchCat;
    });

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-msg">該当する商品がありません。</div>`;
      return;
    }

    grid.innerHTML = filtered.map((item) => {
      const realIndex = catalogItems.indexOf(item);
      const catLabel = normalizeCategory(item.category);
      const isDigital = catLabel === "デジタル写真集";
      const isTeam8 = item.group === "チーム8（OG）";
      const dateLabel = item.date ? item.date.replace(/-/g, "/") : "未定";
      const btnText = isDigital ? "📱 楽天Koboで詳細・購入" : "📕 楽天ブックスで詳細・予約";

      return `
        <article class="card">
          <div class="card-img-wrap">
            ${item.image ? `<img src="${item.image}" alt="${escapeHtml(item.title || '')}" loading="lazy" />` : `<span style="color:#6ee7b7;font-size:0.85rem;font-weight:700;">NO IMAGE</span>`}
          </div>
          <div class="card-body">
            <div class="badges">
              <span class="badge ${isDigital ? 'badge-cat-digital' : 'badge-cat'}">${catLabel}</span>
              <span class="badge ${isTeam8 ? 'badge-team8' : 'badge-group'}">${item.group || ''}</span>
            </div>
            <h2 class="card-title">${escapeHtml(item.title || '')}</h2>
            ${item.memo ? `<div class="memo-box">${escapeHtml(item.memo)}</div>` : ""}
            <div class="card-meta">
              <div class="price">${formatPrice(item.price)} <small>(税込)</small></div>
              <div class="release-date">発売日：${dateLabel}</div>
            </div>
            <div class="card-actions">
              <a class="action-btn btn-rakuten" href="${item.url || '#'}" target="_blank" rel="nofollow sponsored noopener">${btnText}</a>
              ${isAdmin ? `
                <div class="admin-card-btns">
                  <button class="action-btn btn-edit" onclick="editItem(${realIndex})">✏️ 編集する</button>
                  <button class="action-btn btn-del" onclick="deleteItem(${realIndex})">🗑️ 削除</button>
                </div>
              ` : ""}
            </div>
          </div>
        </article>
      `;
    }).join("");
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function editItem(index) {
    const item = catalogItems[index];
    if (!item) return;

    editingIndex = index;

    document.getElementById("manualFormDetails").open = true;
    document.getElementById("inGroup").value = item.group || "乃木坂46";
    document.getElementById("inCategory").value = normalizeCategory(item.category);
    document.getElementById("inDate").value = item.date || "";
    document.getElementById("inPrice").value = item.price || "";
    document.getElementById("inTitle").value = item.title || "";
    document.getElementById("inImage").value = item.image || "";
    document.getElementById("inUrl").value = item.url || "";
    document.getElementById("inMemo").value = item.memo || "";

    const banner = document.getElementById("editBanner");
    document.getElementById("editBannerText").textContent = `✏️ 編集中：${item.title.slice(0, 28)}...`;
    banner.classList.add("visible");

    const saveBtn = document.getElementById("saveBtn");
    saveBtn.textContent = "💾 変更を上書き保存する";
    saveBtn.classList.add("editing");

    document.getElementById("adminPanel").scrollIntoView({ behavior: "smooth" });
  }

  function cancelEdit() {
    editingIndex = null;
    document.getElementById("editBanner").classList.remove("visible");

    const saveBtn = document.getElementById("saveBtn");
    saveBtn.textContent = "＋ 手動入力データをカタログに追加する";
    saveBtn.classList.remove("editing");

    document.getElementById("inDate").value = "";
    document.getElementById("inTitle").value = "";
    document.getElementById("inPrice").value = "";
    document.getElementById("inImage").value = "";
    document.getElementById("inUrl").value = "";
    document.getElementById("inMemo").value = "";
  }

  function saveItem() {
    const group = document.getElementById("inGroup").value;
    const category = document.getElementById("inCategory").value;
    const date = document.getElementById("inDate").value;
    const price = Number(String(document.getElementById("inPrice").value).replace(/[^0-9]/g, ""));
    const title = document.getElementById("inTitle").value.trim();
    const image = document.getElementById("inImage").value.trim();
    const url = document.getElementById("inUrl").value.trim();
    const memo = document.getElementById("inMemo").value.trim();

    if (!title || !url) {
      alert("「商品名」と「楽天アフィリエイトURL」は必須です。");
      return;
    }

    const itemData = { group, category, title, date, price, image, url, memo };

    if (editingIndex !== null && catalogItems[editingIndex]) {
      catalogItems[editingIndex] = itemData;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(catalogItems));
      cancelEdit();
      renderCatalog();
      exportJson();
      alert("変更を上書き保存しました！下のJSONをコピーして items.json に貼り付けてください。");
    } else {
      catalogItems.unshift(itemData);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(catalogItems));
      cancelEdit();
      renderCatalog();
      exportJson();
      alert("カタログに追加しました！下のJSONをコピーして items.json に貼り付けてください。");
    }
  }

  function deleteItem(index) {
    if (!confirm("この商品をリストから削除しますか？")) return;
    if (editingIndex === index) cancelEdit();
    catalogItems.splice(index, 1);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(catalogItems));
    renderCatalog();
    exportJson();
  }

  function exportJson() {
    const area = document.getElementById("jsonOutputArea");
    const textarea = document.getElementById("jsonText");
    area.style.display = "block";
    textarea.value = JSON.stringify(catalogItems, null, 2);
  }

  function resetStorage() {
    if (!confirm("ブラウザの一時保存データを消去し、最新の items.json を再読み込みしますか？")) return;
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }

  document.querySelectorAll("#groupFilters .filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#groupFilters .filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentGroup = btn.dataset.group;
      renderCatalog();
    });
  });

  document.querySelectorAll("#categoryFilters .filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#categoryFilters .filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCategory = btn.dataset.category;
      renderCatalog();
    });
  });

  initCatalog();
</script>
</body>
</html>
